<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How AI Agents Work — 60s Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070A12;
    --ink:#F3F6FF;
    --accent:#5B8CFF;
    --accent-soft:#8FA8E8;
    --dim:#7D88A8;
    --line:rgba(140,160,210,.16);
    --panel:rgba(255,255,255,.035);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(1100px 720px at 50% -8%, #101a33 0%, #070A12 58%, #04060b 100%);
    color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .wrap{display:flex;flex-direction:column;gap:14px;width:min(72vh,88vw,780px);max-width:780px}
  .stage{
    position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
    background:#05070d;
    box-shadow:0 40px 90px -40px rgba(0,0,0,.95), 0 0 0 1px var(--line), 0 0 60px -30px rgba(91,140,255,.5);
  }
  canvas{display:block;width:100%;height:100%}
  #loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
    background:#05070d;transition:opacity .5s ease;
  }
  #loading.hide{opacity:0;pointer-events:none}
  .badge{
    position:absolute;left:14px;bottom:14px;display:none;align-items:center;gap:7px;
    padding:7px 11px;border-radius:999px;background:rgba(7,10,18,.72);
    border:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-soft);
    backdrop-filter:blur(8px);animation:pulse 2s ease-in-out infinite;
  }
  .badge.on{display:flex}
  .badge i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .rec{
    position:absolute;right:14px;top:14px;display:none;align-items:center;gap:7px;
    padding:6px 10px;border-radius:999px;background:rgba(255,60,60,.14);
    border:1px solid rgba(255,90,90,.5);font-size:11px;letter-spacing:.14em;color:#ffb3b3;
  }
  .rec.on{display:flex}
  .rec i{width:7px;height:7px;border-radius:50%;background:#ff4d4d;animation:pulse 1s steps(2,end) infinite}
  .controls{display:flex;align-items:center;gap:8px}
  button{
    font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;cursor:pointer;transition:background .18s,border-color .18s,transform .18s;
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  }
  button:hover{background:rgba(91,140,255,.14);border-color:rgba(91,140,255,.45)}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#05070d}
  button.primary:hover{background:#7aa1ff;border-color:#7aa1ff}
  button.ghost{background:transparent}
  button[disabled]{opacity:.45;cursor:default}
  .time{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;color:var(--dim);letter-spacing:.06em}
  .track{height:3px;border-radius:99px;background:rgba(140,160,210,.14);overflow:hidden}
  .track > div{height:100%;width:0%;background:linear-gradient(90deg,#3f6ee0,var(--accent));box-shadow:0 0 12px rgba(91,140,255,.7)}
  .meta{display:flex;justify-content:space-between;gap:12px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .meta b{color:var(--accent-soft);font-weight:600}
  @media (max-width:520px){
    .wrap{width:94vw}
    button{padding:9px 11px;font-size:12px}
    .meta{font-size:9.5px}
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div id="loading">Building the film…</div>
    <div class="badge" id="soundBadge"><i></i> Tap for sound</div>
    <div class="rec" id="recBadge"><i></i> REC</div>
  </div>
  <div class="controls">
    <button id="playBtn" class="primary">Play</button>
    <button id="restartBtn" class="ghost">Restart</button>
    <button id="recordBtn">● Record</button>
    <button id="muteBtn" class="ghost" title="Mute monitor">🔊</button>
    <span class="time" id="time">00:00 / 01:00</span>
  </div>
  <div class="track"><div id="pbar"></div></div>
  <div class="meta">
    <span>1080 × 1080 · 60s · WebGL</span>
    <span id="status">Ready</span>
  </div>
</main>

<script type="module">
/* =======================================================================
   HOW AI AGENTS WORK — a 60 second brand film
   Built with three.js + Web Audio. Everything is procedural.
   -----------------------------------------------------------------------
   SHOT LIST (10 shots / 60.0s)
   01  0.0 – 5.0   Title      "How AI agents work"     wireframe core, rings
   02  5.0 – 10.5  Loop       "An agent is a loop."     runner on a ring
   03 10.5 – 16.5  Goal       "It reads the goal."      shards form a cube
   04 16.5 – 22.5  Tool       "It picks a tool."        satellite docks
   05 22.5 – 28.5  Data       "The tool returns data."  particles flow in
   06 28.5 – 34.5  Check      "It checks the result."   scan sweep + tick
   07 34.5 – 41.0  Retry      "Wrong? It tries again."  loop arc, jitter
   08 41.0 – 47.0  Ship       "Right? It ships."        launch + shockwave
   09 47.0 – 53.0  Network    "Many tools. One loop."   node constellation
   10 53.0 – 60.0  Outro      "Build your own agent."   brand mark
   ======================================================================= */

let THREE = null;
const THREE_CDN = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
];
for (const url of THREE_CDN) {
  try { THREE = await import(url); break; } catch (err) { /* try the next mirror */ }
}
if (!THREE) {
  document.getElementById('loading').textContent = 'Could not load three.js — this file needs a connection the first time';
  throw new Error('three.js unavailable');
}

/* ---------------------------------------------------------------- palette */
const PAL = {
  bg:      0x070A12,
  ink:     0xF3F6FF,
  accent:  0x5B8CFF,
  accent2: 0x8FA8E8,
  dim:     0x1B2440,
};
const CSS_INK    = '#F3F6FF';
const CSS_DIM    = '#8A96B8';
const CSS_ACCENT = '#8FB0FF';

const W = 1080, H = 1080, DURATION = 60;

/* ---------------------------------------------------------------- helpers */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

/* ---------------------------------------------------------------- renderer */
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.bg);
scene.fog = new THREE.FogExp2(PAL.bg, 0.022);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 300);
camera.position.set(0, 0.5, 15.5);
camera.lookAt(0, 0.5, 0);

const overlay = new THREE.Scene();
const ortho = new THREE.OrthographicCamera(0, W, H, 0, -100, 100);

/* ---------------------------------------------------------------- lights */
scene.add(new THREE.AmbientLight(0x2b3a5c, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 3.4);
key.position.set(3.5, 6, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x7f9bd6, 1.2);
fill.position.set(-6, -2, 4);
scene.add(fill);
const rim = new THREE.PointLight(PAL.accent, 45, 45, 2);
rim.position.set(-5, 2.5, 5.5);
scene.add(rim);

/* ---------------------------------------------------------------- textures */
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function radialTexture(stops, size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => grd.addColorStop(o, col));
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const GLOW_TEX = radialTexture([
  [0, 'rgba(255,255,255,1)'],
  [0.18, 'rgba(255,255,255,0.75)'],
  [0.45, 'rgba(255,255,255,0.22)'],
  [0.75, 'rgba(255,255,255,0.05)'],
  [1, 'rgba(255,255,255,0)'],
]);

function glowSprite(size, opacity, color = PAL.accent) {
  const m = new THREE.SpriteMaterial({
    map: GLOW_TEX, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: true,
  });
  const s = new THREE.Sprite(m);
  s.scale.set(size, size, 1);
  return s;
}

function dustField(count, rMin, rMax, size = 0.055) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(rand(rMin, rMax));
    pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: PAL.accent, size, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  });
  return new THREE.Points(geo, mat);
}

function ringMesh(radius, tube, opacity, color = PAL.accent) {
  return new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, 8, 200),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity })
  );
}

function edgeBox(size, opacity, color = PAL.accent) {
  return new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(size, size, size)),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity })
  );
}

/* clean face grid (no triangle diagonals) */
function boxGrid(size, div, opacity, color = PAL.accent) {
  const h = size / 2, pts = [];
  for (let i = 1; i < div; i++) {
    const u = -h + (i / div) * size;
    for (const z of [h, -h]) {
      pts.push(-h, u, z, h, u, z);
      pts.push(u, -h, z, u, h, z);
    }
    for (const x of [h, -h]) {
      pts.push(x, -h, u, x, h, u);
      pts.push(x, u, -h, x, u, h);
    }
    for (const y of [h, -h]) {
      pts.push(-h, y, u, h, y, u);
      pts.push(u, y, -h, u, y, h);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
}

/* ---------------------------------------------------------------- type */
/* All copy is drawn into canvas textures so it is captured by the recorder. */

function makeText(str, opts = {}) {
  const {
    size = 62, weight = 700, color = CSS_INK, tracking = -0.6,
    lineHeight = 1.14, maxWidth = 888, align = 'left', S = 2,
  } = opts;

  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  let px = size * S;
  const fontStr = p => `${weight} ${p}px Inter, "Helvetica Neue", Arial, sans-serif`;
  const setFont = p => {
    g.font = fontStr(p);
    if ('letterSpacing' in g) g.letterSpacing = `${tracking * S}px`;
  };

  function layout(p) {
    setFont(p);
    const words = str.split(' ');
    const lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (g.measureText(test).width > maxWidth * S && cur) { lines.push(cur); cur = w; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    const widest = Math.max(...lines.map(l => g.measureText(l).width));
    return { lines, widest, h: lines.length * p * lineHeight };
  }

  let L = layout(px);
  let guard = 0;
  while (L.widest > maxWidth * S && px > 14 * S && guard++ < 14) { px *= 0.94; L = layout(px); }

  const padX = 10 * S, padY = 12 * S;
  c.width = Math.ceil(L.widest + padX * 2);
  c.height = Math.ceil(L.h + padY * 2);

  setFont(px);
  g.textBaseline = 'middle';
  g.textAlign = align === 'center' ? 'center' : 'left';
  g.fillStyle = color;
  L.lines.forEach((line, i) => {
    const y = padY + px * lineHeight * (i + 0.5);
    const x = align === 'center' ? c.width / 2 : padX;
    g.fillText(line, x, y);
  });

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  tex.minFilter = THREE.LinearMipmapLinearFilter;

  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(c.width / S, c.height / S),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false })
  );
  mesh.renderOrder = 20;
  mesh.userData.w = c.width / S;
  mesh.userData.h = c.height / S;
  return mesh;
}

/* place by top-left in screen pixels (0,0 = top-left of the 1080 frame) */
function placeTL(mesh, x, y) {
  mesh.position.set(x + mesh.userData.w / 2, H - y - mesh.userData.h / 2, 0);
  mesh.userData.baseY = mesh.position.y;
  return mesh;
}
function placeCenter(mesh, y) {
  mesh.position.set(W / 2, H - y - mesh.userData.h / 2, 0);
  mesh.userData.baseY = mesh.position.y;
  return mesh;
}

/* ---------------------------------------------------------------- backdrop */
const backdrop = new THREE.Group();
scene.add(backdrop);

const stars = dustField(620, 14, 44, 0.06);
stars.material.opacity = 0.45;
backdrop.add(stars);

const gridTex = (() => {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.strokeStyle = 'rgba(120,155,235,0.55)';
  g.lineWidth = 1.5;
  g.strokeRect(0.75, 0.75, s - 1.5, s - 1.5);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(9, 9);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

const gridPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(90, 90),
  new THREE.MeshBasicMaterial({ map: gridTex, transparent: true, opacity: 0.075, depthWrite: false })
);
gridPlane.position.set(0, 0, -26);
backdrop.add(gridPlane);

const backGlow = glowSprite(40, 0.22);
backGlow.position.set(0, 1, -24);
backdrop.add(backGlow);

/* ---------------------------------------------------------------- overlay */
const vignette = new THREE.Mesh(
  new THREE.PlaneGeometry(W, H),
  new THREE.MeshBasicMaterial({
    map: radialTexture([
      [0, 'rgba(0,0,0,0)'], [0.5, 'rgba(0,0,0,0)'],
      [0.78, 'rgba(0,0,0,0.28)'], [1, 'rgba(0,0,0,0.9)'],
    ]),
    transparent: true, depthTest: false, depthWrite: false,
  })
);
vignette.position.set(W / 2, H / 2, -50);
vignette.renderOrder = 1;
overlay.add(vignette);

const grainTex = (() => {
  const s = 160;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const img = g.createImageData(s, s);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 34;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 3);
  return t;
})();

const grain = new THREE.Mesh(
  new THREE.PlaneGeometry(W, H),
  new THREE.MeshBasicMaterial({ map: grainTex, transparent: true, opacity: 0.5, depthTest: false, depthWrite: false })
);
grain.position.set(W / 2, H / 2, -40);
grain.renderOrder = 2;
overlay.add(grain);

const flash = new THREE.Mesh(
  new THREE.PlaneGeometry(W, H),
  new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending })
);
flash.position.set(W / 2, H / 2, -30);
flash.renderOrder = 3;
overlay.add(flash);

const blackout = new THREE.Mesh(
  new THREE.PlaneGeometry(W, H),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 1, depthTest: false, depthWrite: false })
);
blackout.position.set(W / 2, H / 2, 60);
blackout.renderOrder = 90;
overlay.add(blackout);

/* =======================================================================
   SHOT BUILDERS
   Each returns update(tl, p, alpha) where tl = seconds into the shot.
   ======================================================================= */

/* 01 — TITLE ------------------------------------------------------------ */
function buildTitle(g) {
  const shell = new THREE.Mesh(
    new THREE.IcosahedronGeometry(2.25, 1),
    new THREE.MeshStandardMaterial({
      color: 0x0d1730, metalness: 0.55, roughness: 0.32, flatShading: true,
      emissive: PAL.accent, emissiveIntensity: 0.05, transparent: true, opacity: 0.96,
    })
  );
  const wire = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(2.27, 1)),
    new THREE.LineBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0.6 })
  );
  g.add(shell, wire);

  const rings = [];
  const ringCfg = [[2.62, 0.018, 1.18, 0.18], [3.0, 0.012, -0.55, 0.85], [3.4, 0.009, 0.42, -0.45]];
  ringCfg.forEach(([r, tube, rx, rz], i) => {
    const m = ringMesh(r, tube, 0.3 - i * 0.06);
    m.rotation.set(rx, 0, rz);
    m.userData.baseRot = [rx, rz];
    g.add(m); rings.push(m);
  });

  const glow = glowSprite(9, 0.4);
  glow.position.z = -1.2;
  g.add(glow);

  const dust = dustField(200, 2.5, 4.4, 0.045);
  g.add(dust);

  return (tl, p, alpha) => {
    shell.rotation.y = tl * 0.3;
    shell.rotation.x = Math.sin(tl * 0.42) * 0.13;
    wire.rotation.copy(shell.rotation);
    rings.forEach((r, i) => {
      r.rotation.x = r.userData.baseRot[0] + Math.sin(tl * 0.35 + i) * 0.08;
      r.rotation.z = r.userData.baseRot[1] + tl * (0.1 + i * 0.045);
    });
    dust.rotation.y = -tl * 0.06;
    glow.material.opacity = glow.material.userData.base * alpha * (0.85 + Math.sin(tl * 2.2) * 0.15);
  };
}

/* 02 — THE LOOP --------------------------------------------------------- */
function buildLoop(g) {
  const tilt = new THREE.Group();
  tilt.rotation.set(-0.6, 0, 0.16);
  g.add(tilt);

  const ring = ringMesh(2.28, 0.026, 0.92);
  tilt.add(ring);

  const ring2 = ringMesh(2.6, 0.008, 0.3);
  ring2.rotation.set(0.7, 0.25, 0);
  tilt.add(ring2);

  const halo = glowSprite(6.4, 0.32);
  halo.position.z = -0.8;
  tilt.add(halo);

  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.125, 20, 20),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  const dotGlow = glowSprite(1.9, 0.95);
  dot.add(dotGlow);
  tilt.add(dot);

  const N = 40, trail = [];
  for (let i = 0; i < N; i++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.014 + 0.048 * (1 - i / N), 8, 8),
      new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0.62 })
    );
    tilt.add(m); trail.push(m);
  }

  const R = 2.28;
  return (tl, p, alpha) => {
    const a0 = -Math.PI / 2 + tl * 1.12;
    dot.position.set(Math.cos(a0) * R, Math.sin(a0) * R, 0);
    trail.forEach((m, i) => {
      const a = a0 - (i + 1) * 0.052;
      const k = 1 - i / N;
      m.position.set(Math.cos(a) * R, Math.sin(a) * R, 0);
      m.material.opacity = m.material.userData.base * alpha * k * k;
    });
    ring2.rotation.z = tl * 0.28;
    const beat = 1 + Math.sin(tl * 3.4) * 0.008;
    tilt.scale.setScalar(beat);
  };
}

/* 03 — READ THE GOAL ---------------------------------------------------- */
function buildGoal(g) {
  const cube = new THREE.Group();
  g.add(cube);

  const N = 5, gap = 0.44, size = 0.35;
  const shardGeo = new THREE.BoxGeometry(size, size, size);
  const shards = [];

  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) for (let z = 0; z < N; z++) {
    const light = Math.random() < 0.05;
    const m = new THREE.Mesh(shardGeo, new THREE.MeshStandardMaterial({
      color: light ? 0xb3c6f2 : 0x1b3059,
      metalness: 0.45, roughness: 0.38,
      emissive: PAL.accent, emissiveIntensity: light ? 0.3 : 0.12,
      transparent: true, opacity: 0.97,
    }));
    const tgt = new THREE.Vector3(
      (x - (N - 1) / 2) * gap,
      (y - (N - 1) / 2) * gap,
      (z - (N - 1) / 2) * gap
    );
    m.position.copy(new THREE.Vector3().randomDirection().multiplyScalar(rand(4.2, 7.6)));
    m.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
    m.scale.setScalar(0.001);
    const dist = Math.abs(x - 2) + Math.abs(y - 2) + Math.abs(z - 2);
    m.userData = {
      tgt, start: m.position.clone(),
      delay: Math.random() * 0.45 + dist * 0.075,
      spin: new THREE.Vector3(rand(-4, 4), rand(-4, 4), rand(-4, 4)),
    };
    cube.add(m); shards.push(m);
  }

  const wire = edgeBox(2.24, 0.4, PAL.ink);
  cube.add(wire);

  const coreGlow = glowSprite(4.2, 0.16);
  coreGlow.position.z = -1.4;
  cube.add(coreGlow);

  return (tl, p, alpha) => {
    const rot = Math.max(0, tl - 2.3);
    cube.rotation.y = 0.4 + rot * 0.3;
    cube.rotation.x = 0.08 + Math.sin(rot * 0.55) * 0.1;

    shards.forEach(m => {
      const k = clamp((tl - 0.15 - m.userData.delay) / 1.5, 0, 1);
      const e = easeOutCubic(k);
      m.position.lerpVectors(m.userData.start, m.userData.tgt, e);
      m.rotation.set(m.userData.spin.x * (1 - e), m.userData.spin.y * (1 - e), m.userData.spin.z * (1 - e));
      m.scale.setScalar(0.12 + 0.88 * e);
    });

    wire.material.opacity = wire.material.userData.base * alpha * smoothstep(1.15, 1.9, tl);
    const lit = smoothstep(0.9, 1.9, tl);
    coreGlow.material.opacity = coreGlow.material.userData.base * alpha * (0.4 + 0.6 * lit) * (0.85 + Math.sin(tl * 2.2) * 0.15);
  };
}

/* 04 — PICK A TOOL ------------------------------------------------------ */
function buildTool(g) {
  const core = new THREE.Mesh(
    new THREE.BoxGeometry(1.3, 1.3, 1.3),
    new THREE.MeshStandardMaterial({
      color: 0x1b2c4e, metalness: 0.4, roughness: 0.42,
      emissive: PAL.accent, emissiveIntensity: 0.1,
    })
  );
  g.add(core);
  const coreWire = edgeBox(1.32, 0.85);
  g.add(coreWire);
  const coreGlow = glowSprite(3.4, 0.3);
  g.add(coreGlow);

  const R = 3.1, N = 7, DOCK = new THREE.Vector3(1.55, 0.62, 0.95);
  const link = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), DOCK.clone()]),
    new THREE.LineBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0.8 })
  );
  g.add(link);
  const sats = [];
  for (let i = 0; i < N; i++) {
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(i === 2 ? 0.21 : 0.17, 20, 20),
      new THREE.MeshBasicMaterial({ color: i === 2 ? 0xffffff : PAL.accent, transparent: true, opacity: i === 2 ? 1 : 0.85 })
    );
    const gl = glowSprite(i === 2 ? 1.4 : 0.6, i === 2 ? 0.9 : 0.3);
    s.add(gl);
    g.add(s);
    sats.push({ mesh: s, phase: i * 2.4, incl: 0.35 + (i % 3) * 0.22, gl });
  }

  const orbitRing = ringMesh(R, 0.006, 0.14);
  orbitRing.rotation.set(1.28, 0, 0);
  g.add(orbitRing);

  const pulse = new THREE.Mesh(
    new THREE.TorusGeometry(0.55, 0.014, 8, 96),
    new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0 })
  );
  pulse.position.copy(DOCK);
  g.add(pulse);

  const orbitAt = (i, t) => {
    const a = t * 0.52 + sats[i].phase;
    return new THREE.Vector3(
      Math.cos(a) * R,
      Math.sin(a) * R * Math.sin(sats[i].incl) * 0.55,
      Math.sin(a) * R * Math.cos(sats[i].incl)
    );
  };

  return (tl, p, alpha) => {
    core.rotation.y = tl * 0.22;
    core.rotation.x = Math.sin(tl * 0.6) * 0.1;
    coreWire.rotation.copy(core.rotation);

    sats.forEach((s, i) => {
      const pos = orbitAt(i, tl);
      if (i === 2) {
        const k = easeInOutCubic(clamp((tl - 1.5) / 1.05, 0, 1));
        pos.lerp(DOCK, k);
        pos.y += Math.sin(tl * 2.4) * 0.05 * k;
      }
      s.mesh.position.copy(pos);
      const dim = i === 2 ? 1 : lerp(1, 0.35, clamp((tl - 1.4) / 1.2, 0, 1));
      s.mesh.material.opacity = s.mesh.material.userData.base * alpha * dim;
      s.gl.material.opacity = s.gl.material.userData.base * alpha * dim;
    });

    const k = clamp((tl - 2.35) / 0.7, 0, 1);
    pulse.scale.setScalar(0.5 + k * 1.5);
    pulse.material.opacity = pulse.material.userData.base * alpha * (1 - k) * (k > 0 ? 1 : 0);
    coreGlow.material.opacity = coreGlow.material.userData.base * alpha * (0.55 + 0.45 * Math.sin(tl * 3));
    link.material.opacity = link.material.userData.base * alpha * smoothstep(2.25, 2.7, tl) * 0.9;
    orbitRing.material.opacity = orbitRing.material.userData.base * alpha;
  };
}

/* 05 — TOOL RETURNS DATA ------------------------------------------------ */
function buildReturn(g) {
  const core = new THREE.Mesh(
    new THREE.BoxGeometry(1.15, 1.15, 1.15),
    new THREE.MeshStandardMaterial({
      color: 0x1b2c4e, metalness: 0.4, roughness: 0.42,
      emissive: PAL.accent, emissiveIntensity: 0.1,
    })
  );
  g.add(core);
  const coreWire = edgeBox(1.17, 0.9);
  g.add(coreWire);
  const coreGlow = glowSprite(3.6, 0.35);
  g.add(coreGlow);

  const dock = new THREE.Vector3(2.05, 0.95, 0.9);
  const tool = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 20, 20),
    new THREE.MeshBasicMaterial({ color: 0xb9ccff })
  );
  tool.position.copy(dock);
  const toolGlow = glowSprite(1.0, 0.65);
  tool.add(toolGlow);
  g.add(tool);

  const curve = new THREE.CatmullRomCurve3([
    dock.clone(),
    new THREE.Vector3(1.55, 1.75, 1.55),
    new THREE.Vector3(0.35, 1.15, 0.75),
    new THREE.Vector3(0, 0, 0),
  ]);

  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 80, 0.016, 6, false),
    new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0.45 })
  );
  g.add(tube);

  const N = 170;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.2, vertexColors: true, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  }));
  g.add(pts);

  const head = glowSprite(1.7, 0.9);
  g.add(head);

  const base = new THREE.Color(PAL.accent);
  const tmp = new THREE.Vector3();

  return (tl, p, alpha) => {
    core.rotation.y = tl * 0.3;
    core.rotation.x = Math.sin(tl * 0.5) * 0.12;
    coreWire.rotation.copy(core.rotation);
    tube.material.opacity = tube.material.userData.base * alpha * smoothstep(0.1, 0.9, tl) * 0.9;

    for (let i = 0; i < N; i++) {
      const u = (tl * 0.4 + i / N) % 1;
      curve.getPoint(u, tmp);
      pos[i * 3] = tmp.x; pos[i * 3 + 1] = tmp.y; pos[i * 3 + 2] = tmp.z;
      const fade = Math.pow(Math.sin(Math.PI * u), 0.6);
      const hot = (0.4 + 0.6 * fade) * 1.55;
      col[i * 3] = base.r * hot; col[i * 3 + 1] = base.g * hot; col[i * 3 + 2] = base.b * hot;
    }
    geo.attributes.position.needsUpdate = true;
    geo.attributes.color.needsUpdate = true;

    const hu = (tl * 0.4) % 1;
    const hk = Math.pow(Math.sin(Math.PI * hu), 0.5);
    curve.getPoint(hu, tmp);
    head.position.copy(tmp);
    head.material.opacity = head.material.userData.base * alpha * 0.9;
    toolGlow.material.opacity = toolGlow.material.userData.base * alpha * (0.5 + hk * 0.5);
    coreGlow.material.opacity = coreGlow.material.userData.base * alpha * (0.6 + 0.4 * Math.abs(Math.sin(tl * 3.2)));
    pts.material.opacity = alpha;
  };
}

/* 06 — CHECK THE RESULT ------------------------------------------------- */
function checkTexture() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.strokeStyle = '#ffffff';
  g.lineWidth = 20;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(58, 136);
  g.lineTo(106, 186);
  g.lineTo(200, 78);
  g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}

function buildCheck(g) {
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(1.85, 1.85, 1.85),
    new THREE.MeshStandardMaterial({
      color: 0x1b2c4e, metalness: 0.45, roughness: 0.4,
      emissive: PAL.accent, emissiveIntensity: 0.08,
    })
  );
  g.add(box);

  const grid = boxGrid(1.87, 4, 0.2);
  g.add(grid);
  const edges = edgeBox(1.89, 0.75);
  g.add(edges);

  const scan = new THREE.Group();
  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(2.7, 0.014, 2.7),
    new THREE.MeshBasicMaterial({
      color: PAL.accent, transparent: true, opacity: 0.95,
      depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
    })
  );
  bar.renderOrder = 8;
  const scanGlow = glowSprite(3.2, 0.55);
  scanGlow.scale.set(3.4, 1.1, 1);
  scan.add(bar, scanGlow);
  g.add(scan);

  const tick = new THREE.Mesh(
    new THREE.PlaneGeometry(1.25, 1.25),
    new THREE.MeshBasicMaterial({
      map: checkTexture(), color: PAL.accent, transparent: true, opacity: 0,
      depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
    })
  );
  tick.position.set(0, 0, 1.2);
  tick.renderOrder = 9;
  g.add(tick);

  const tickGlow = glowSprite(3.4, 0);
  tickGlow.position.z = 0.9;
  g.add(tickGlow);

  return (tl, p, alpha) => {
    box.rotation.y = Math.sin(tl * 0.4) * 0.22;
    box.rotation.x = Math.cos(tl * 0.32) * 0.1;
    grid.rotation.copy(box.rotation);
    edges.rotation.copy(box.rotation);

    let sy = 1.4, op = 0;
    if (tl > 0.45 && tl < 4.0) {
      const cycle = ((tl - 0.45) % 1.75) / 1.75;
      sy = lerp(1.35, -1.35, easeInOutCubic(cycle));
      op = smoothstep(0, 0.12, cycle) * (1 - smoothstep(0.86, 1, cycle));
    } else if (tl >= 4.0) {
      sy = -1.35; op = 0;
    }
    scan.position.y = sy;
    bar.material.opacity = bar.material.userData.base * alpha * op;
    scanGlow.material.opacity = scanGlow.material.userData.base * alpha * op;

    const k = clamp((tl - 4.15) / 0.55, 0, 1);
    const e = 1 - Math.pow(1 - k, 3);
    const pop = 0.6 + 0.4 * e + Math.sin(k * Math.PI) * 0.18;
    tick.scale.setScalar(pop);
    tick.material.opacity = tick.material.userData.base * alpha * e;
    tickGlow.scale.setScalar(3.4 * pop);
    tickGlow.material.opacity = tickGlow.material.userData.base * alpha * e;
  };
}

/* 07 — RETRY ------------------------------------------------------------ */
function buildRetry(g) {
  const ghosts = [];
  [-0.95, 0.95].forEach(off => {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.2, 1.2),
      new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0.1 })
    );
    m.position.x = off;
    g.add(m); ghosts.push(m);
  });

  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 1.4, 1.4),
    new THREE.MeshStandardMaterial({
      color: 0x1b2c4e, metalness: 0.4, roughness: 0.42,
      emissive: PAL.accent, emissiveIntensity: 0.1,
    })
  );
  g.add(cube);
  const cubeWire = edgeBox(1.42, 0.9);
  g.add(cubeWire);
  const cubeGlow = glowSprite(3.2, 0.32);
  g.add(cubeGlow);

  const arc = new THREE.Mesh(
    new THREE.TorusGeometry(2.15, 0.022, 8, 160, Math.PI * 1.55),
    new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0.75 })
  );
  arc.rotation.z = Math.PI * 0.62;
  g.add(arc);

  const runner = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  const runnerGlow = glowSprite(1.5, 0.9);
  runner.add(runnerGlow);
  g.add(runner);

  const pulseRings = [];
  for (let i = 0; i < 3; i++) {
    const r = new THREE.Mesh(
      new THREE.TorusGeometry(1.0, 0.012, 6, 96),
      new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0 })
    );
    g.add(r); pulseRings.push(r);
  }

  return (tl, p, alpha) => {
    const cyc = (tl % 1.6) / 1.6;
    const shake = Math.sin(tl * 34) * 0.045 * (1 - cyc) * smoothstep(0, 0.2, cyc);

    cube.position.set(shake, Math.sin(tl * 1.2) * 0.05, 0);
    cube.rotation.y = tl * 0.35;
    cube.rotation.z = shake * 0.6;
    cubeWire.position.copy(cube.position);
    cubeWire.rotation.copy(cube.rotation);
    cubeGlow.position.copy(cube.position);
    cubeGlow.material.opacity = cubeGlow.material.userData.base * alpha * (0.75 + 0.25 * Math.sin(tl * 6));

    ghosts.forEach((m, i) => {
      m.position.x = (i === 0 ? -1 : 1) * (0.5 + 0.25 * Math.sin(tl * 2 + i));
      m.rotation.copy(cube.rotation);
      m.material.opacity = m.material.userData.base * alpha * (0.7 + 0.3 * Math.sin(tl * 3 + i));
    });

    const a = Math.PI * 0.62 + (tl * 1.35) % (Math.PI * 1.55);
    runner.position.set(Math.cos(a) * 2.15, Math.sin(a) * 2.15, 0);

    pulseRings.forEach((r, i) => {
      const k = ((tl + i * 0.53) % 1.6) / 1.6;
      r.scale.setScalar(0.5 + k * 2.0);
      r.material.opacity = r.material.userData.base * alpha * (1 - k) * 0.55;
    });
  };
}

/* 08 — SHIP ------------------------------------------------------------- */
function buildShip(g) {
  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 1.4, 1.4),
    new THREE.MeshStandardMaterial({
      color: 0x111c38, metalness: 0.7, roughness: 0.25,
      emissive: PAL.accent, emissiveIntensity: 0.35,
    })
  );
  g.add(cube);
  const wire = edgeBox(1.42, 0.95);
  g.add(wire);
  const charge = glowSprite(4.2, 0.25);
  g.add(charge);

  const flashS = glowSprite(9, 0);
  g.add(flashS);

  const beam = glowSprite(1, 0);
  beam.scale.set(0.9, 6, 1);
  g.add(beam);

  const halo = new THREE.Mesh(
    new THREE.TorusGeometry(1.32, 0.01, 6, 120),
    new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0.45 })
  );
  g.add(halo);

  const rings = [];
  for (let i = 0; i < 3; i++) {
    const r = new THREE.Mesh(
      new THREE.TorusGeometry(1.0, 0.016, 8, 120),
      new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0 })
    );
    r.rotation.x = Math.PI / 2;
    g.add(r); rings.push(r);
  }

  const N = 90;
  const pos = new Float32Array(N * 3);
  const seeds = [];
  for (let i = 0; i < N; i++) {
    seeds.push({ x: rand(-1.1, 1.1), z: rand(-1.1, 1.1), sp: rand(0.5, 1.6), off: rand(0, 1) });
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const trail = new THREE.Points(geo, new THREE.PointsMaterial({
    color: PAL.accent, size: 0.09, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  g.add(trail);

  return (tl, p, alpha) => {
    const launch = 1.0;
    let y = 0;

    if (tl < launch) {
      const k = tl / launch;
      const squash = 1 - 0.16 * Math.sin(k * Math.PI);
      cube.scale.set(1 / squash, squash, 1 / squash);
      y = -0.12 * Math.sin(k * Math.PI);
      cube.rotation.y = tl * 0.9;
      charge.scale.setScalar(4.2 * (1 + k * 0.45));
      charge.material.opacity = charge.material.userData.base * alpha * k;
      flashS.material.opacity = 0;
    } else {
      const k = clamp((tl - launch) / 0.85, 0, 1);
      y = (1 - Math.pow(1 - k, 2)) * 1.35;
      const sc = 1 - 0.12 * k;
      cube.scale.set(sc, sc, sc);
      cube.rotation.y = tl * 2.2;
      charge.position.y = y;
      charge.material.opacity = charge.material.userData.base * alpha * (0.45 + 0.25 * Math.sin(tl * 3));
      flashS.position.y = 0.35;
      flashS.material.opacity = flashS.material.userData.base * alpha * Math.max(0, 1 - (tl - launch) / 0.55);
    }
    y += Math.sin(tl * 1.6) * 0.05 * smoothstep(launch, launch + 1, tl);
    cube.position.set(0, y, 0);
    beam.position.set(0, y - 2.6, 0);
    beam.material.opacity = beam.material.userData.base * alpha *
      (tl < launch ? 0 : 0.22 + 0.1 * Math.sin(tl * 2.2));
    halo.position.y = y;
    halo.rotation.set(1.18, 0, tl * 0.55);
    halo.material.opacity = halo.material.userData.base * alpha * smoothstep(launch, launch + 0.6, tl);
    wire.position.copy(cube.position);
    wire.rotation.copy(cube.rotation);
    wire.scale.copy(cube.scale);

    rings.forEach((r, i) => {
      const k = clamp((tl - launch - i * 0.14) / 2.2, 0, 1);
      r.scale.setScalar(0.6 + k * 2.6);
      r.position.y = -0.45;
      r.material.opacity = r.material.userData.base * alpha * (1 - k);
    });

    const tk = clamp((tl - launch) / 5.0, 0, 1);
    trail.material.opacity = alpha * (0.45 + 0.45 * (1 - tk));
    for (let i = 0; i < N; i++) {
      const s = seeds[i];
      const rise = Math.min(4.5, Math.max(0, tl - launch) * s.sp * 1.3);
      pos[i * 3] = s.x * (0.9 + rise * 0.1);
      pos[i * 3 + 1] = -0.6 + rise + s.off * 0.5;
      pos[i * 3 + 2] = s.z * (0.9 + rise * 0.1);
    }
    geo.attributes.position.needsUpdate = true;
  };
}

/* 09 — MANY TOOLS, ONE LOOP --------------------------------------------- */
function buildNetwork(g) {
  const nodes = [];
  const N = 34;
  const gold = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = gold * i;
    nodes.push(new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r).multiplyScalar(2.85));
  }

  const lines = new THREE.BufferGeometry();
  const lpos = new Float32Array((N + 1) * 3 * 2);
  for (let i = 0; i < N; i++) {
    lpos[i * 6] = 0; lpos[i * 6 + 1] = 0; lpos[i * 6 + 2] = 0;
    lpos[i * 6 + 3] = nodes[i].x; lpos[i * 6 + 4] = nodes[i].y; lpos[i * 6 + 5] = nodes[i].z;
  }
  lines.setAttribute('position', new THREE.BufferAttribute(lpos, 3));
  const lineMesh = new THREE.LineSegments(lines, new THREE.LineBasicMaterial({
    color: PAL.accent, transparent: true, opacity: 0.22,
  }));
  g.add(lineMesh);

  const spheres = [];
  nodes.forEach((v, i) => {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(i % 5 === 0 ? 0.1 : 0.062, 12, 12),
      new THREE.MeshBasicMaterial({ color: i % 5 === 0 ? PAL.ink : PAL.accent, transparent: true, opacity: 0.85 })
    );
    m.position.copy(v);
    g.add(m); spheres.push(m);
  });

  const hub = new THREE.Mesh(
    new THREE.SphereGeometry(0.19, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  const hubGlow = glowSprite(2.1, 0.7);
  hub.add(hubGlow);
  g.add(hub);

  const loop = ringMesh(1.5, 0.012, 0.5);
  loop.rotation.x = Math.PI / 2.4;
  g.add(loop);

  const outer = ringMesh(2.86, 0.008, 0.32);
  outer.rotation.set(1.15, 0.15, 0);
  g.add(outer);

  return (tl, p, alpha) => {
    g.rotation.y = tl * 0.22;
    g.rotation.x = Math.sin(tl * 0.3) * 0.1;

    spheres.forEach((m, i) => {
      const phase = (tl * 0.9 - i * 0.09) % 2;
      const pulse = 0.6 + 0.4 * Math.exp(-Math.pow(phase, 2) * 6);
      m.scale.setScalar(pulse);
      m.material.opacity = m.material.userData.base * alpha * (0.5 + 0.5 * pulse);
    });

    const lift = smoothstep(2.6, 3.6, tl);
    lineMesh.material.opacity = lineMesh.material.userData.base * alpha * (0.7 + 0.6 * lift);
    hubGlow.material.opacity = hubGlow.material.userData.base * alpha * (0.75 + 0.25 * Math.sin(tl * 4));
    loop.rotation.z = tl * 0.5;
    loop.material.opacity = loop.material.userData.base * alpha;
    outer.rotation.z = -tl * 0.25;
    outer.material.opacity = outer.material.userData.base * alpha;
    g.scale.setScalar(1 + lift * 0.05);
  };
}

/* 10 — OUTRO ------------------------------------------------------------ */
function buildOutro(g) {
  const ring = ringMesh(1.85, 0.024, 0.9);
  g.add(ring);
  const ring2 = ringMesh(2.15, 0.006, 0.25);
  ring2.rotation.set(0.6, 0.2, 0);
  g.add(ring2);

  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 20, 20),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  const dotGlow = glowSprite(1.8, 0.95);
  dot.add(dotGlow);
  g.add(dot);

  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 24, 24),
    new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0.85 })
  );
  const coreGlow = glowSprite(4.2, 0.4);
  core.add(coreGlow);
  g.add(core);

  const halo = glowSprite(9, 0.22);
  halo.position.z = -2;
  g.add(halo);

  const waves = [];
  for (let i = 0; i < 3; i++) {
    const w = new THREE.Mesh(
      new THREE.TorusGeometry(1.0, 0.01, 6, 120),
      new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0 })
    );
    g.add(w); waves.push(w);
  }

  return (tl, p, alpha) => {
    const a0 = -Math.PI / 2 + tl * 1.05;
    dot.position.set(Math.cos(a0) * 1.85, Math.sin(a0) * 1.85, 0);
    ring2.rotation.z = tl * 0.3;
    coreGlow.material.opacity = coreGlow.material.userData.base * alpha * (0.7 + 0.3 * Math.sin(tl * 2.4));

    waves.forEach((w, i) => {
      const k = ((tl * 0.55 + i * 0.33) % 1);
      w.scale.setScalar(1 + k * 3.2);
      w.material.opacity = w.material.userData.base * alpha * (1 - k) * 0.5;
    });
  };
}

const CONTENT_SCALE = 1.55;

const SHOTS = [
  { id: 'title', dur: 5.0, build: buildTitle, y: 2.3, scale: 0.56, layout: 'center',
    main: 'How AI agents work', mainY: 650, mainSize: 84, weight: 800,

  { id: 'loop', dur: 5.5, build: buildLoop, y: 0.85, scale: 0.88, main: 'An agent is a loop.' },
  { id: 'goal', dur: 6.0, build: buildGoal, y: 0.5, scale: 1.1, main: 'It reads the goal.' },
  { id: 'tool', dur: 6.0, build: buildTool, y: 0.75, scale: 0.7, main: 'It picks a tool.' },
  { id: 'data', dur: 6.0, build: buildReturn, y: 0.5, scale: 0.95, main: 'The tool returns data.' },

  { id: 'outro', dur: 7.0, build: buildOutro, y: 2.4, scale: 0.85, layout: 'center',
    main: 'Build your own agent.', mainY: 664, mainSize: 76, weight: 800,
    sub: 'One loop. Any task.', subY: 796 },
];

let acc = 0;
const shotList = SHOTS.map((s, i) => {
  const o = { ...s, i, start: acc };
  acc += s.dur;
  o.end = acc;
  return o;
});
const TOTAL = acc;

function buildShotText(s) {
  const grp = new THREE.Group();
  overlay.add(grp);
  const items = [];

  if (s.layout === 'center') {
    const main = makeText(s.main, {
      size: s.mainSize || 76, weight: s.weight || 800, align: 'center',
      tracking: -1.6, maxWidth: 900, lineHeight: 1.1,
    });
    placeCenter(main, s.mainY);
    grp.add(main); items.push(main);

    if (s.sub) {
      const sub = makeText(s.sub, {
        size: 25, weight: 500, color: CSS_DIM, tracking: 2.4,
        align: 'center', maxWidth: 820,
      });
      placeCenter(sub, s.subY);
      grp.add(sub); items.push(sub);
    }
  } else {
    const tick = new THREE.Mesh(
      new THREE.PlaneGeometry(52, 3),
      new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, depthTest: false, depthWrite: false })
    );
    tick.userData.w = 52; tick.userData.h = 3;
    placeTL(tick, 96, 846);
    tick.renderOrder = 20;
    grp.add(tick); items.push(tick);

    const main = makeText(s.main, {
      size: 63, weight: 700, tracking: -0.9, maxWidth: 888, lineHeight: 1.12,
    });
    placeTL(main, 96, 872);
    grp.add(main); items.push(main);
  }

  items.forEach(m => {
    m.userData.base = m.material.opacity;
    m.material.userData.base = m.material.opacity;
    m.material.transparent = true;
  });
  s.textGroup = grp;
  s.textMeshes = items;
}

shotList.forEach(s => {
  const wrap = new THREE.Group();
  wrap.position.y = s.y ?? 0.55;
  scene.add(wrap);

  const g = new THREE.Group();
  wrap.add(g);

  s.update = s.build(g);
  s.wrap = wrap;
  s.group = g;

  const mats = new Set();
  wrap.traverse(o => {
    if (!o.material) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      /* opacity 0 means "animated up from nothing" — keep a usable base */
      if (m.userData.base === undefined) m.userData.base = m.opacity ? m.opacity : 1;
      if (!m.transparent) { m.transparent = true; m.needsUpdate = true; }
      mats.add(m);
    });
  });
  s.mats = [...mats];
});

const CUTS = shotList.slice(1).map(s => s.start);
const LAST = shotList.length - 1;
const FADE = 0.34;

function alphaFor(s, t) {
  /* the incoming shot is already strong on the cut; the old one dissolves under it */
  const inA = s.i === 0 ? 1 : smoothstep(s.start - FADE, s.start - 0.05, t);
  const outA = s.i === LAST ? 1 : 1 - smoothstep(s.end - 0.35, s.end + 0.05, t);
  return Math.min(inA, outA);
}

/* ---------------------------------------------------------------- render */
function render(t) {
  camera.position.x = Math.sin(t * 0.21) * 0.16;
  camera.position.y = 0.5 + Math.sin(t * 0.16) * 0.07;
  camera.lookAt(0, 0.5, 0);

  stars.rotation.y = t * 0.012;
  stars.rotation.x = Math.sin(t * 0.05) * 0.03;
  gridPlane.position.x = Math.sin(t * 0.09) * 1.4;
  backGlow.material.opacity = 0.18 + Math.sin(t * 0.45) * 0.045;

  for (const s of shotList) {
    const a = alphaFor(s, t);
    const vis = a > 0.004;
    s.wrap.visible = vis;

    /* copy never cross-fades with the next line — it clears on the cut */
    const ta = (s.i === 0 ? 1 : smoothstep(s.start, s.start + 0.3, t)) *
               (s.i === LAST ? 1 : 1 - smoothstep(s.end - 0.3, s.end, t));
    if (s.textGroup) s.textGroup.visible = ta > 0.004;
    if (!vis) continue;

    const env = 0.968 + 0.032 * a;
    s.wrap.scale.setScalar((s.scale || 1) * CONTENT_SCALE * env);

    for (const m of s.mats) m.opacity = m.userData.base * a;
    s.update(Math.max(0, t - s.start), clamp((t - s.start) / s.dur, 0, 1), a);

    if (s.textMeshes) {
      for (const m of s.textMeshes) {
        m.material.opacity = m.userData.base * ta;
        m.position.y = m.userData.baseY + (1 - ta) * 16;
      }
    }
  }

  let fl = 0;
  for (const b of CUTS) fl = Math.max(fl, Math.max(0, 1 - Math.abs(t - b) / 0.2));
  flash.material.opacity = fl * 0.09;

  blackout.material.opacity = Math.max(
    1 - smoothstep(0, 0.55, t),
    smoothstep(TOTAL - 0.85, TOTAL - 0.08, t)
  );

  grainTex.offset.set(Math.random() * 0.35, Math.random() * 0.35);

  renderer.autoClear = true;
  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.clearDepth();
  renderer.render(overlay, ortho);
}

/* =======================================================================
   AUDIO — every sound is synthesised with the Web Audio API
   ======================================================================= */

const BPM = 100, BEAT = 60 / BPM, BAR = BEAT * 4;

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.ready = false;
    this.events = [];
    this.cursor = 0;
    this.origin = 0;
    this.active = new Set();
    this.muted = false;
  }

  async init() {
    if (this.ctx) {
      if (this.ctx.state !== 'running') await this.ctx.resume();
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx({ latencyHint: 'interactive' });
    this.ctx = ctx;

    this.master = ctx.createGain();
    this.master.gain.value = 0.9;

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 3.2;
    comp.attack.value = 0.005; comp.release.value = 0.25;

    const out = ctx.createGain();
    out.gain.value = 1;

    this.speaker = ctx.createGain();
    this.speaker.gain.value = this.muted ? 0 : 1;

    this.streamDest = ctx.createMediaStreamDestination();

    this.master.connect(comp);
    comp.connect(out);
    out.connect(this.speaker);
    this.speaker.connect(ctx.destination);
    out.connect(this.streamDest);

    this.music = ctx.createGain(); this.music.gain.value = 0.6;  this.music.connect(this.master);
    this.drums = ctx.createGain(); this.drums.gain.value = 0.52; this.drums.connect(this.master);
    this.sfx   = ctx.createGain(); this.sfx.gain.value = 0.55;   this.sfx.connect(this.master);

    const conv = ctx.createConvolver();
    conv.buffer = this.makeIR(2.8, 2.4);
    this.revIn = ctx.createGain();
    this.revIn.gain.value = 1;
    const revOut = ctx.createGain();
    revOut.gain.value = 0.5;
    this.revIn.connect(conv); conv.connect(revOut); revOut.connect(this.master);

    const dl = ctx.createDelay(1.0);
    dl.delayTime.value = 0.36;
    const fb = ctx.createGain(); fb.gain.value = 0.32;
    const dlf = ctx.createBiquadFilter(); dlf.type = 'lowpass'; dlf.frequency.value = 2400;
    const dlOut = ctx.createGain(); dlOut.gain.value = 0.4;
    dl.connect(dlf); dlf.connect(fb); fb.connect(dl); dlf.connect(dlOut); dlOut.connect(this.music);
    this.delayIn = ctx.createGain();
    this.delayIn.connect(dl);

    this.noise = this.makeNoise(2);
    this.buildEvents();
    this.ready = true;
    if (ctx.state !== 'running') await ctx.resume();
  }

  makeIR(dur, decay) {
    const ctx = this.ctx, sr = ctx.sampleRate, len = Math.floor(sr * dur);
    const buf = ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const x = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, decay) * (i < sr * 0.012 ? 0 : 1);
      }
    }
    return buf;
  }

  makeNoise(dur) {
    const ctx = this.ctx, sr = ctx.sampleRate, len = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  track(node) {
    this.active.add(node);
    node.onended = () => this.active.delete(node);
  }

  /* ---------------------------------------------------------- arrangement */
  buildEvents() {
    const ev = [];
    const chords = [
      { notes: [220.00, 261.63, 329.63], root: 55.00 },  // Am
      { notes: [174.61, 220.00, 261.63], root: 43.65 },  // F
      { notes: [261.63, 329.63, 392.00], root: 65.41 },  // C
      { notes: [196.00, 246.94, 293.66], root: 49.00 },  // G
    ];
    const bars = Math.ceil(TOTAL / BAR);

    for (let b = 0; b < bars; b++) {
      const t0 = b * BAR;
      const ch = chords[b % 4];

      ev.push({ t: t0, k: 'pad', notes: ch.notes, dur: BAR * 1.02 });

      if (t0 >= 4.8) {
        for (let s = 0; s < 16; s++) {
          const tt = t0 + s * (BAR / 16);
          if (tt > TOTAL - 0.5) break;
          const n = ch.notes[[0, 1, 2, 1][s % 4]] * 2;
          ev.push({ t: tt, k: 'arp', f: n, amp: s % 4 === 0 ? 1 : 0.55 });
        }
      }

      if (t0 >= 9.6 && t0 < 57.6) {
        for (let s = 0; s < 8; s++) {
          if (s % 2 === 0 || b >= 8) {
            ev.push({ t: t0 + s * (BAR / 8), k: 'bass', f: ch.root, amp: s % 2 === 0 ? 1 : 0.55 });
          }
        }
      }

      if (t0 >= 9.6 && t0 < 52.8) {
        for (let bt = 0; bt < 4; bt++) {
          const tt = t0 + bt * BEAT;
          if (bt % 2 === 0) ev.push({ t: tt, k: 'kick', amp: 1 });
          if (b >= 6) {
            ev.push({ t: tt, k: 'hat', amp: 0.75 });
            ev.push({ t: tt + BEAT / 2, k: 'hat', amp: 0.35 });
          }
          if (b >= 8 && (bt === 1 || bt === 3)) ev.push({ t: tt, k: 'clap', amp: 0.8 });
        }
      }
    }

    [5.0, 10.5, 16.5, 22.5, 28.5, 34.5, 41.0, 47.0, 53.0].forEach(t => {
      ev.push({ t: Math.max(0, t - 0.3), k: 'whoosh', amp: 0.5 });
    });
    ev.push({ t: 16.5, k: 'blip', f: 880, amp: 0.5 });
    ev.push({ t: 28.5, k: 'blip', f: 1174.7, amp: 0.42 });
    ev.push({ t: 41.0, k: 'impact', amp: 0.95 });
    ev.push({ t: 47.0, k: 'impact', amp: 0.8 });
    ev.push({ t: 53.0, k: 'impact', amp: 0.7 });
    ev.push({ t: 45.2, k: 'riser', dur: 1.9, amp: 0.5 });
    ev.push({ t: 59.0, k: 'bell', f: 1318.5, amp: 0.4 });

    ev.sort((a, b) => a.t - b.t);
    this.events = ev;
  }

  /* ---------------------------------------------------------- scheduling */
  pump(videoT) {
    if (!this.ready || !this.ctx || this.ctx.state !== 'running') return;
    const horizon = videoT + 0.35;
    while (this.cursor < this.events.length && this.events[this.cursor].t <= horizon) {
      const e = this.events[this.cursor++];
      const at = this.origin + e.t;
      if (at > this.ctx.currentTime - 0.03) this.play(e, at);
    }
  }

  stopAll() {
    const ctx = this.ctx;
    if (!ctx) return;
    const now = ctx.currentTime;
    const g = this.master.gain;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(0.0001, now + 0.05);
    g.setValueAtTime(0.9, now + 0.14);
    for (const s of this.active) {
      try { s.stop(now + 0.06); } catch (e) { /* already stopped */ }
      try { s.disconnect(); } catch (e) { /* noop */ }
    }
    this.active.clear();
    this.cursor = 0;
  }

  setMuted(m) {
    this.muted = m;
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    this.speaker.gain.cancelScheduledValues(now);
    this.speaker.gain.linearRampToValueAtTime(m ? 0 : 1, now + 0.12);
  }

  /* ---------------------------------------------------------- instruments */
  play(e, at) {
    const ctx = this.ctx;
    switch (e.k) {
      case 'pad': return this.pad(at, e.notes, e.dur);
      case 'bass': return this.bass(at, e.f, e.amp);
      case 'arp': return this.arp(at, e.f, e.amp);
      case 'kick': return this.kick(at, e.amp);
      case 'hat': return this.hat(at, e.amp);
      case 'clap': return this.clap(at, e.amp);
      case 'whoosh': return this.whoosh(at, e.amp);
      case 'blip': return this.blip(at, e.f, e.amp);
      case 'impact': return this.impact(at, e.amp);
      case 'riser': return this.riser(at, e.dur, e.amp);
      case 'bell': return this.bell(at, e.f, e.amp);
    }
  }

  pad(at, notes, dur) {
    const ctx = this.ctx;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.052, at + 0.9);
    g.gain.setValueAtTime(0.052, at + Math.max(0.95, dur - 1.1));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);

    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.Q.value = 0.7;
    f.frequency.setValueAtTime(620, at);
    f.frequency.linearRampToValueAtTime(1750, at + dur * 0.55);

    g.connect(f);
    f.connect(this.music);
    const send = ctx.createGain();
    send.gain.value = 0.45;
    f.connect(send); send.connect(this.revIn);

    notes.forEach((n, i) => {
      [-7, 7].forEach(det => {
        const o = ctx.createOscillator();
        o.type = i === 0 ? 'sawtooth' : 'triangle';
        o.frequency.value = n;
        o.detune.value = det;
        const og = ctx.createGain();
        og.gain.value = i === 0 ? 0.42 : 0.26;
        o.connect(og); og.connect(g);
        o.start(at); o.stop(at + dur + 0.05);
        this.track(o);
      });
    });
  }

  bass(at, f, amp) {
    const ctx = this.ctx;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.5 * amp, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.34);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 1.2;

    const o = ctx.createOscillator();
    o.type = 'triangle'; o.frequency.value = f;
    const o2 = ctx.createOscillator();
    o2.type = 'sine'; o2.frequency.value = f;

    o.connect(g); o2.connect(g);
    g.connect(lp); lp.connect(this.music);
    o.start(at); o.stop(at + 0.36); this.track(o);
    o2.start(at); o2.stop(at + 0.36); this.track(o2);
  }

  arp(at, f, amp) {
    const ctx = this.ctx;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.055 * amp, at + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.22);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 3200;

    const o = ctx.createOscillator();
    o.type = 'triangle'; o.frequency.value = f;
    o.connect(g); g.connect(lp);
    lp.connect(this.music);
    const s = ctx.createGain(); s.gain.value = 0.6;
    lp.connect(s); s.connect(this.delayIn);
    o.start(at); o.stop(at + 0.24); this.track(o);
  }

  kick(at, amp) {
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(132, at);
    o.frequency.exponentialRampToValueAtTime(42, at + 0.11);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.85 * amp, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.4);
    o.connect(g); g.connect(this.drums);
    o.start(at); o.stop(at + 0.42); this.track(o);
  }

  hat(at, amp) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noise;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 7600;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.14 * amp, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.06);
    src.connect(hp); hp.connect(g); g.connect(this.drums);
    src.start(at); src.stop(at + 0.08); this.track(src);
  }

  clap(at, amp) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noise;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1750; bp.Q.value = 1.3;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    [0, 0.011, 0.022].forEach(d => {
      g.gain.setValueAtTime(0.22 * amp, at + d);
      g.gain.exponentialRampToValueAtTime(0.0001, at + d + 0.055);
    });
    src.connect(bp); bp.connect(g); g.connect(this.drums);
    const send = ctx.createGain(); send.gain.value = 0.25;
    g.connect(send); send.connect(this.revIn);
    src.start(at); src.stop(at + 0.16); this.track(src);
  }

  whoosh(at, amp) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noise;
    src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(260, at);
    bp.frequency.exponentialRampToValueAtTime(3200, at + 0.42);
    bp.frequency.exponentialRampToValueAtTime(420, at + 0.85);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.16 * amp, at + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.9);
    src.connect(bp); bp.connect(g); g.connect(this.sfx);
    const send = ctx.createGain(); send.gain.value = 0.3;
    g.connect(send); send.connect(this.revIn);
    src.start(at); src.stop(at + 0.95); this.track(src);
  }

  blip(at, f, amp) {
    const ctx = this.ctx;
    [1, 1.5].forEach((mul, i) => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f * mul;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(0.1 * amp / (i + 1), at + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.45);
      o.connect(g); g.connect(this.sfx);
      const send = ctx.createGain(); send.gain.value = 0.5;
      g.connect(send); send.connect(this.revIn);
      o.start(at); o.stop(at + 0.5); this.track(o);
    });
  }

  impact(at, amp) {
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(95, at);
    o.frequency.exponentialRampToValueAtTime(30, at + 0.5);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.55 * amp, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.75);
    o.connect(g); g.connect(this.sfx);
    o.start(at); o.stop(at + 0.8); this.track(o);

    const src = ctx.createBufferSource();
    src.buffer = this.noise;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.2 * amp, at);
    ng.gain.exponentialRampToValueAtTime(0.0001, at + 0.28);
    src.connect(lp); lp.connect(ng); ng.connect(this.sfx);
    src.start(at); src.stop(at + 0.3); this.track(src);
  }

  riser(at, dur, amp) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noise; src.loop = true;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(300, at);
    hp.frequency.exponentialRampToValueAtTime(6000, at + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.11 * amp, at + dur * 0.85);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    src.connect(hp); hp.connect(g); g.connect(this.sfx);
    src.start(at); src.stop(at + dur + 0.05); this.track(src);
  }

  bell(at, f, amp) {
    const ctx = this.ctx;
    [1, 2.02, 3.01].forEach((mul, i) => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f * mul;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(0.075 * amp / (i + 1), at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 2.4);
      o.connect(g); g.connect(this.sfx);
      const send = ctx.createGain(); send.gain.value = 0.6;
      g.connect(send); send.connect(this.revIn);
      o.start(at); o.stop(at + 2.5); this.track(o);
    });
  }
}

/* =======================================================================
   PLAYER
   ======================================================================= */

const audio = new AudioEngine();

const el = {
  play: document.getElementById('playBtn'),
  restart: document.getElementById('restartBtn'),
  record: document.getElementById('recordBtn'),
  mute: document.getElementById('muteBtn'),
  time: document.getElementById('time'),
  pbar: document.getElementById('pbar'),
  status: document.getElementById('status'),
  badge: document.getElementById('soundBadge'),
  rec: document.getElementById('recBadge'),
  loading: document.getElementById('loading'),
};

let t = 0;
let playing = false;
let lastTs = 0;
let audioOn = false;
let recording = false;
let recorder = null;
let chunks = [];
let recMime = '';
let textReady = false;

const fmt = s => {
  const v = Math.max(0, Math.floor(s));
  return `${String(Math.floor(v / 60)).padStart(2, '0')}:${String(v % 60).padStart(2, '0')}`;
};
const setStatus = s => { el.status.textContent = s; };

async function ensureAudio() {
  if (audioOn) return;
  await audio.init();
  audioOn = true;
  el.badge.classList.remove('on');
  setStatus('Sound on');
}

function syncAudio() {
  if (audio.ready) audio.origin = audio.ctx.currentTime - t + 0.05;
}

function seek(v) {
  t = clamp(v, 0, TOTAL);
  if (audio.ready) {
    audio.stopAll();
    audio.cursor = 0;
    syncAudio();
  }
  lastTs = 0;
}

async function play() {
  if (!audioOn) {
    try { await ensureAudio(); } catch (e) { /* silent fallback */ }
    seek(0);
    playing = true;
    return;
  }
  if (t >= TOTAL) seek(0);
  if (audio.ctx && audio.ctx.state !== 'running') { try { await audio.ctx.resume(); } catch (e) { /* noop */ } }
  syncAudio();
  playing = true;
  lastTs = 0;
}

function pause() {
  playing = false;
  if (audio.ctx && audio.ctx.state === 'running') audio.ctx.suspend();
}

async function togglePlay() {
  if (!audioOn) { await play(); return; }   // first press: turn sound on and restart
  if (playing) pause();
  else await play();
}

function finish() {
  playing = false;
  if (recording) stopRecording();
  setStatus(recording ? 'Finishing…' : 'Done — press Play to replay');
}

/* ---------------------------------------------------------------- record */
const MIMES = [
  'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
  'video/mp4',
  'video/webm;codecs=vp9,opus',
  'video/webm;codecs=vp8,opus',
  'video/webm',
];

function pickMime() {
  if (!window.MediaRecorder) return '';
  for (const m of MIMES) if (MediaRecorder.isTypeSupported(m)) return m;
  return '';
}

async function startRecording() {
  if (recording) return;
  if (!window.MediaRecorder || !canvas.captureStream) {
    setStatus('This browser cannot record — try Chrome or Edge');
    return;
  }
  try { await ensureAudio(); } catch (e) { /* noop */ }
  seek(0);

  const stream = canvas.captureStream(30);
  const track = audio.streamDest ? audio.streamDest.stream.getAudioTracks()[0] : null;
  if (track) stream.addTrack(track);

  recMime = pickMime();
  try {
    recorder = new MediaRecorder(stream, {
      mimeType: recMime || undefined,
      videoBitsPerSecond: 14_000_000,
      audioBitsPerSecond: 192_000,
    });
  } catch (err) {
    setStatus('Recorder error: ' + err.message);
    return;
  }

  chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const type = (recMime.split(';')[0] || 'video/webm');
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `how-ai-agents-work-1080.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    recording = false;
    el.rec.classList.remove('on');
    el.record.disabled = false;
    setStatus(`Saved .${ext} · ${(blob.size / 1048576).toFixed(1)} MB`);
  };

  recording = true;
  el.rec.classList.add('on');
  el.record.disabled = true;
  setStatus('Recording — keep this tab visible');

  recorder.start(1000);
  playing = true;
  syncAudio();
  lastTs = 0;
}

function stopRecording() {
  if (!recording || !recorder) return;
  if (recorder.state !== 'inactive') recorder.stop();
}

/* ---------------------------------------------------------------- loop */
function updateUI() {
  el.play.textContent = playing ? 'Pause' : 'Play';
  el.time.textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
  el.pbar.style.width = `${(t / TOTAL) * 100}%`;
}

function tick(ts) {
  requestAnimationFrame(tick);
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;

  if (playing) {
    t += dt;
    if (t >= TOTAL) { t = TOTAL; finish(); }
    if (audio.ready) audio.pump(t);
  }
  render(t);
  updateUI();
}

/* ---------------------------------------------------------------- wiring */
el.play.addEventListener('click', togglePlay);
el.restart.addEventListener('click', () => { seek(0); playing = false; setStatus('Ready'); });
el.record.addEventListener('click', startRecording);
el.mute.addEventListener('click', () => {
  const m = !audio.muted;
  audio.setMuted(m);
  el.mute.textContent = m ? '🔇' : '🔊';
});

document.getElementById('stage').addEventListener('click', () => {
  if (!audioOn) { play(); }
});

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.key === 'r' || e.key === 'R') { seek(0); playing = false; }
});

/* ---------------------------------------------------------------- boot */
async function boot() {
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load('800 84px Inter'),
        document.fonts.load('700 63px Inter'),
        document.fonts.load('500 25px Inter'),
        document.fonts.load('400 20px Inter'),
      ]).then(() => document.fonts.ready),
      new Promise(r => setTimeout(r, 3000)),
    ]);
  } catch (e) { /* fall back to system font */ }

  shotList.forEach(buildShotText);
  textReady = true;

  render(0);
  el.loading.classList.add('hide');
  setTimeout(() => el.loading.remove(), 600);

  el.badge.classList.add('on');
  setStatus('Tap the frame for sound');

  // the film starts on its own, silently — a click restarts it with audio
  playing = true;
  lastTs = 0;
  requestAnimationFrame(tick);
}

/* tiny control hook: jump to any second of the film from the console */
window.__film = {
  shots: shotList.map(s => ({ id: s.id, start: s.start, end: s.end })),
  total: TOTAL,
  get t() { return t; },
  seek,
  play,
  pause,
};

boot();
</script>
